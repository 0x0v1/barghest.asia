name: Daily rebuild

# Rebuilds the site once a day so /mail/ picks up new mailing-list threads
# (they are fetched from lists.sr.ht at build time).
# Requires the repository secret CF_PAGES_DEPLOY_HOOK: the Cloudflare Pages
# deploy hook URL (Pages project > Settings > Builds & deployments > Deploy hooks).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CF_PAGES_DEPLOY_HOOK is not set" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
